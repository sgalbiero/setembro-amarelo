        <nav class="support-links" aria-label="Contatos de apoio">
          <a href="tel:188" aria-label="Ligar para o CVV no número 188"><span>CVV</span> 188</a>
          <a href="tel:192" aria-label="Ligar para o SAMU no número 192"><span>SAMU</span> 192</a>
        </nav>
      </section>

      <section class="frame frame--welcome" id="quadro-2" aria-labelledby="titulo-2" data-frame="2">
        <a class="back-link" href="#quadro-1" data-go="1" aria-label="Voltar ao primeiro quadro">Voltar</a>
        <div class="frame__content frame__content--welcome">

        <a class="advance-control" href="#quadro-3" role="button" aria-label="Arraste para cima ou toque para avançar ao quadro de esperança" data-go="3">

          <h2 id="titulo-3">A chuva irá passar,<br><span>vale a pena esperar<br>pela primavera.</span></h2>

        <nav class="support-links" aria-label="Contatos de apoio">
